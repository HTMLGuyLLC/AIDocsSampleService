# Pipeline step: after a deploy, an agent runs the smoke test and reports pass or fail in the run log.
# It never rolls back. A person decides. Run it by hand from the Actions tab, or call it from your deploy workflow.
# This workflow has no Dynatrace access, so it covers the smoke test only. For the before/after error comparison,
# run the post-deploy-check skill locally, where the Dynatrace connector in .mcp.json is set up.
# Off by default. To turn it on: add the ANTHROPIC_API_KEY secret and set the repository variable AI_PIPELINE to "on".
# Point base_url at dev or staging only: the smoke test creates and pays an order.
# See docs/ai-pipeline.md.
name: AI post-deploy check

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Base URL of the environment to check (dev or staging, never prod)
        required: true
        type: string

jobs:
  post-deploy-check:
    if: vars.AI_PIPELINE == 'on'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: anthropics/claude-code-action@v1
        env:
          BASE_URL: ${{ inputs.base_url }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the smoke-test part of .claude/skills/post-deploy-check/SKILL.md against ${{ inputs.base_url }}
            (BASE_URL is already set). Use exactly: `npm --prefix orders-api ci`, then `npm --prefix orders-api run smoke`.
            There is no Dynatrace access here: skip the error comparison and say so.
            Report pass or fail, with what failed, as your final message. Don't roll back or change anything.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Bash(npm --prefix orders-api ci),Bash(npm --prefix orders-api run smoke:*)"
